services:
  app:
    build:
      context: /home/docker/php
      dockerfile: Dockerfile
    container_name: starttoo_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - /home/web/laravel12_starttoo_api:/var/www/html
      - starttoo_storage:/var/www/html/storage
      - starttoo_bootstrap_cache:/var/www/html/bootstrap/cache
    networks:
      - starttoo_network
      - db_network

  nginx:
    image: nginx:alpine
    container_name: starttoo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/web/laravel12_starttoo_api:/var/www/html
      - starttoo_storage:/var/www/html/storage
      - starttoo_bootstrap_cache:/var/www/html/bootstrap/cache
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /home/docker/certbot/www:/var/www/certbot
      - /home/docker/certbot/conf:/etc/letsencrypt
    networks:
      - starttoo_network
    depends_on:
      - app

  # 아래 서비스는 사용하지 않음. DB는 별도 mysql 컨테이너(startoo_network) 사용.
  # 주석을 풀면 3306/6379/6001이 외부에 공개되므로 주의.
  # mysql:     (원본은 /root/backup/streetcat-chat-20261104-1808/docker-compose.yml)
  # redis:
  # soketi:

networks:
  starttoo_network:
    driver: bridge
  db_network:
    external: true
    name: startoo_network

volumes:
  starttoo_mysql_data:
    driver: local
  starttoo_redis_data:
    driver: local
  starttoo_storage:
    driver: local
  starttoo_bootstrap_cache:
    driver: local
