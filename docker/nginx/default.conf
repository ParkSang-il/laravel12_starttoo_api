server {                                                                                                                                                                                                                              
      listen 80;                                                                                                                                                                                                                        
      server_name streetcat.duckdns.org;                                                                                                                                                                                                
                                                                                                                                                                                                                                        
      location /.well-known/acme-challenge/ {                                                                                                                                                                                           
          root /var/www/certbot;                                                                                                                                                                                                        
      }                                                                                                                                                                                                                                 
                                                                                                                                                                                                                                        
      location / {                                                                                                                                                                                                                      
          return 301 https://$host$request_uri;                                                                                                                                                                                         
      }                                                                                                                                                                                                                                 
  }                                                                                                                                                                                                                                     
                                                                                                                                                                                                                                        
  server {                                                                                                                                                                                                                              
      listen 443 ssl;                                                                                                                                                                                                                   
      http2 on;                                                                                                                                                                                                                         
      server_name streetcat.duckdns.org;                                                                                                                                                                                                
                                                                                                                                                                                                                                        
      ssl_certificate     /etc/letsencrypt/live/streetcat.duckdns.org/fullchain.pem;                                                                                                                                                    
      ssl_certificate_key /etc/letsencrypt/live/streetcat.duckdns.org/privkey.pem;                                                                                                                                                      
      ssl_protocols TLSv1.2 TLSv1.3;                                                                                                                                                                                                    
                                                                                                                                                                                                                                        
      index index.php index.html;                                                                                                                                                                                                       
      root /var/www/html/public;                                                                                                                                                                                                        
      client_max_body_size 20m;                                                                                                                                                                                                         
                                                                                                                                                                                                                                        
      location / {                                                                                                                                                                                                                      
          try_files $uri $uri/ /index.php?$query_string;                                                                                                                                                                                
      }                                                                                                                                                                                                                                 
                                                                                                                                                                                                                                        
      location ~ \.php$ {                                                                                                                                                                                                               
          fastcgi_pass app:9000;                                                                                                                                                                                                        
          fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;                                                                                                                                                             
          include fastcgi_params;                                                                                                                                                                                                       
          fastcgi_index index.php;                                                                                                                                                                                                      
      }                                                                                                                                                                                                                                 
                                                                                                                                                                                                                                        
      # Reverb WebSocket (chat-reverb 컨테이너, 외부 포트 게시 없음)
      location ^~ /app/ {
          resolver 127.0.0.11 valid=10s ipv6=off;
          set $reverb_upstream http://chat-reverb:8080;
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "Upgrade";
          proxy_read_timeout 120s;
          proxy_send_timeout 120s;
          proxy_pass $reverb_upstream;
      }

      location ~ /\.ht {                                                                                                                                                                                                                
          deny all;                                                                                                                                                                                                                     
      }                                                                                                                                                                                                                                 
  }
