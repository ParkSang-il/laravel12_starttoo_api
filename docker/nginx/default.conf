# 도메인: www.starttoo.com(기본) · starttoo.com · streetcat.duckdns.org(이전 앱 빌드 호환)
# 인증서: 세 도메인을 한 인증서에 넣는다(certbot --expand, 저장 폴더 이름은 streetcat.duckdns.org 그대로)

# www.starttoo.com 은 Cloudflare Tunnel(starttoo-tunnel, 서버 안 cloudflared)로 들어온다
# → 서버 안쪽(cloudflared)에서 온 요청만 실제 접속자 IP 를 CF-Connecting-IP 에서 읽는다
#   (콘솔 로그인 횟수 제한 · IP 허용 · 감사 로그 IP 가 정확해진다. 앱이 바로 오는 api · streetcat 요청은 그대로)
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name www.starttoo.com starttoo.com streetcat.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# starttoo.com → www.starttoo.com
server {
    listen 443 ssl;
    http2 on;
    server_name starttoo.com;

    ssl_certificate     /etc/letsencrypt/live/streetcat.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/streetcat.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.starttoo.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.starttoo.com streetcat.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/streetcat.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/streetcat.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    index index.php index.html;
    root /var/www/html/public;
    # 광고 문의 소재(영상 50MB · 최대 5개). PHP post_max_size(docker/php/php.ini)와 같이 바꾼다
    client_max_body_size 160m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_read_timeout 180s;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_index index.php;
    }

    # Reverb WebSocket (chat-reverb 컨테이너, 외부 포트 게시 없음)
    location ^~ /app/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $reverb_upstream http://chat-reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass $reverb_upstream;
    }

    location ~ /\.ht {
        deny all;
    }
}
