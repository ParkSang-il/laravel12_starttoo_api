# 채팅용 서비스. 항상 base와 함께 사용:
#   docker compose -f docker-compose.yml -f docker-compose.chat.yml ...
# 외부 포트(ports:)는 절대 추가하지 않음. 외부 공개는 nginx 443만.

x-chat-php: &chat-php
  image: laravel12_starttoo_api-app
  pull_policy: never
  working_dir: /var/www/html
  user: "1000:1000"
  init: true
  restart: unless-stopped
  stop_signal: SIGTERM
  volumes:
    - /home/web/laravel12_starttoo_api:/var/www/html
    - starttoo_storage:/var/www/html/storage
    - starttoo_bootstrap_cache:/var/www/html/bootstrap/cache
  networks:
    - starttoo_network
    - db_network
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  chat-reverb:
    <<: *chat-php
    container_name: starttoo_chat_reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    stop_grace_period: 30s
    # 소켓 연결 수에 비례(연결당 수십 KB)
    mem_limit: 1g
    memswap_limit: 1g
    ulimits:
      nofile:
        soft: 10000
        hard: 10000
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  chat-queue-rt:
    <<: *chat-php
    container_name: starttoo_chat_queue_rt
    # STARTTOO 소셜 푸시도 기존 chat-push 큐에서 처리한다.
    # 파일은 서버 비공개 경로에 두며, 기존 컨테이너를 재생성하면 마운트된다.
    volumes:
      - /home/web/laravel12_starttoo_api:/var/www/html
      - starttoo_storage:/var/www/html/storage
      - starttoo_bootstrap_cache:/var/www/html/bootstrap/cache
      - ${STARTTOO_FCM_HOST_DIR:-/home/docker/secrets/starttoo}:/run/secrets/starttoo:ro
    command: ["php", "artisan", "queue:work", "database", "--queue=chat-realtime,chat-push,chat-marketing", "--sleep=1", "--tries=3", "--backoff=5", "--timeout=30", "--max-time=3600"]
    stop_grace_period: 60s
    mem_limit: 1g
    memswap_limit: 1g

  chat-queue-media:
    <<: *chat-php
    container_name: starttoo_chat_queue_media
    # video-transcode: 무빙(동영상) 변환(작업 제한 600초, ffmpeg · ffprobe 필요). chat-media 를 먼저 처리한다
    command: ["php", "artisan", "queue:work", "database", "--queue=chat-media,video-transcode", "--sleep=3", "--tries=3", "--backoff=5", "--timeout=330", "--max-time=3600"]
    stop_grace_period: 620s
    # ffmpeg(1080p 원본 + HLS 3~4단계 동시 변환 1~2GB) + AI 이미지 처리(PHP 256M) + 여유
    mem_limit: 6g
    memswap_limit: 6g
    # 서버 16코어 중 절반까지만: 변환이 몰려도 API · 채팅 · DB 몫을 남긴다
    cpus: 8

  chat-scheduler:
    <<: *chat-php
    container_name: starttoo_chat_scheduler
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 60s
    mem_limit: 512m
    memswap_limit: 512m
